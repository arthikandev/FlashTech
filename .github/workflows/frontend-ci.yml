# Builds frontend on main; does not touch setup-clerk or backend workflows.
name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "scripts/write-runtime-config.mjs"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "scripts/write-runtime-config.mjs"
      - ".github/workflows/frontend-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Apply backend URL for build (optional secret)
        env:
          PRESENCEIQ_BACKEND_URL: ${{ secrets.PRESENCEIQ_BACKEND_URL }}
        run: node ../scripts/write-runtime-config.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      # Optional platform binaries are sometimes omitted after npm cache restore (npm/cli#4828).
      - name: Ensure Linux native bindings
        if: runner.os == 'Linux'
        run: |
          ROLLUP_V=$(node -e "console.log(JSON.parse(require('fs').readFileSync('node_modules/rollup/package.json','utf8')).version)")
          LIGHTNING_V=$(node -e "console.log(JSON.parse(require('fs').readFileSync('node_modules/lightningcss/package.json','utf8')).version)")
          npm install --no-save \
            "@rollup/rollup-linux-x64-gnu@${ROLLUP_V}" \
            "lightningcss-linux-x64-gnu@${LIGHTNING_V}"

      - name: Build
        env:
          VITE_BACKEND_URL: ${{ secrets.PRESENCEIQ_BACKEND_URL }}
          VITE_CONVEX_URL: ${{ secrets.PRESENCEIQ_CONVEX_URL }}
        run: npm run build
