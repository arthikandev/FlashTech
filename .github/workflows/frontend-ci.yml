# Builds frontend on main; does not touch setup-clerk or backend workflows.
name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "scripts/write-runtime-config.mjs"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "scripts/write-runtime-config.mjs"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Apply backend URL for build (optional secret)
        env:
          PRESENCEIQ_BACKEND_URL: ${{ secrets.PRESENCEIQ_BACKEND_URL }}
        run: node ../scripts/write-runtime-config.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Rollup 4 optional platform packages are sometimes skipped after npm cache restore (npm/cli#4828).
      - name: Ensure Rollup Linux native binding
        if: runner.os == 'Linux'
        run: npm install --no-save "@rollup/rollup-linux-x64-gnu@$(node -p "require('rollup/package.json').version")"

      - name: Build
        env:
          VITE_BACKEND_URL: ${{ secrets.PRESENCEIQ_BACKEND_URL }}
          VITE_CONVEX_URL: ${{ secrets.PRESENCEIQ_CONVEX_URL }}
        run: npm run build
