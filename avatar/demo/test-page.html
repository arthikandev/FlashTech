<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PresenceIQ — Avatar test (Seylan demo)</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 720px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      #presenceiq-avatar {
        min-height: 120px;
        margin-top: 1.5rem;
        visibility: hidden;
      }
      .hint {
        color: #64748b;
        font-size: 0.9rem;
      }
      button {
        margin-top: 0.5rem;
        margin-right: 0.5rem;
      }
    </style>
  </head>
  <body>
    <h1>Seylan Bank — Avatar test page</h1>
    <p class="hint">
      Person 1 unblocker. Backend must run on port 3000. Set
      <code>localStorage piq_fp</code> for Sarangan demo.
    </p>
    <button type="button" id="btn-sarangan">Use Sarangan fingerprint</button>
    <button type="button" id="btn-reload">Reload page</button>
    <button type="button" id="btn-mock-end">Mock session end (post-call webhook)</button>

    <div id="presenceiq-avatar" aria-live="polite"></div>

  <script src="./config.js"></script>
  <script>
    document.getElementById("btn-sarangan").onclick = () => {
      localStorage.setItem("piq_fp", "demo-sarangan-fp");
      alert("Set piq_fp=demo-sarangan-fp — reload the page");
    };
    document.getElementById("btn-reload").onclick = () => location.reload();
    document.getElementById("btn-mock-end").onclick = () => {
      window.dispatchEvent(new Event("presenceiq:mock-session-end"));
    };
  </script>
  <script>
    (function () {
      var base =
        (window.__PRESENCEIQ_CONFIG__ && window.__PRESENCEIQ_CONFIG__.backendUrl) ||
        "http://localhost:3000";
      var s = document.createElement("script");
      s.src = base.replace(/\/$/, "") + "/api/embed/seylan-demo";
      s.async = true;
      document.body.appendChild(s);
    })();
  </script>
  <script src="./presenceiq-avatar.js"></script>
  </body>
</html>
