<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coral Resort — Booking Demo</title>
    <style>
      body { margin: 0; font-family: Georgia, serif; background: #1c1917; color: #fef3c7; }
      header { padding: 1rem 2rem; background: #292524; display: flex; justify-content: space-between; align-items: center; }
      .logo { font-size: 1.25rem; color: #f97316; }
      nav a { color: #a8a29e; margin-left: 1rem; text-decoration: none; }
      .hero { padding: 3rem 2rem; background: linear-gradient(180deg, #44403c 0%, #1c1917 100%); }
      .booking { padding: 2rem; max-width: 480px; }
      .booking input, .booking select { width: 100%; padding: 0.5rem; margin: 0.5rem 0 1rem; border-radius: 6px; border: 1px solid #57534e; background: #292524; color: #fef3c7; }
      #avatar-slot { position: fixed; bottom: 1rem; right: 1rem; width: 300px; height: 380px; border-radius: 12px; border: 2px solid #f97316; background: #111; z-index: 50; }
      #avatar-slot.hidden, #avatar-spinner.hidden { display: none; }
      #avatar-spinner { position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 51; background: #f97316; color: #1c1917; padding: 0.5rem 1rem; border-radius: 8px; font-weight: 600; font-size: 0.875rem; }
    </style>
  </head>
  <body>
    <header>
      <span class="logo">Coral Resort & Spa</span>
      <nav>
        <a href="#/">Resort</a>
        <a href="#/booking">Book now</a>
      </nav>
    </header>
    <section data-route="/" class="hero">
      <h1>Paradise on the south coast</h1>
      <p>Ocean villas, spa, and fine dining.</p>
    </section>
    <section data-route="/booking" class="booking hidden">
      <h2>Reserve your stay</h2>
      <label>Check-in <input type="date" /></label>
      <label>Guests <select><option>2 adults</option><option>Family suite</option></select></label>
      <button style="background:#f97316;border:none;padding:0.75rem 1.5rem;border-radius:8px;color:#1c1917;font-weight:600;cursor:pointer">Check availability</button>
    </section>
    <div id="avatar-spinner" class="hidden">Concierge loading…</div>
    <div id="avatar-slot" class="hidden"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
